# /etc/nginx/sites-available/rentflow
# Symlink: ln -s /etc/nginx/sites-available/rentflow /etc/nginx/sites-enabled/rentflow
# Test: nginx -t && systemctl reload nginx

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

# ─── API (NestJS) ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.rentflow.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rentflow.com;

    ssl_certificate /etc/letsencrypt/live/rentflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rentflow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 25M;

    # Serve uploads statically
    location /uploads/ {
        alias /var/www/rentflow/uploads/;
        valid_referers none blocked rentflow.com *.rentflow.com;
        if ($invalid_referer) { return 403; }
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Auth endpoints — stricter rate limit
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    # All other API endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ─── Landlord App ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name landlord.rentflow.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name landlord.rentflow.com;

    ssl_certificate /etc/letsencrypt/live/rentflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rentflow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

